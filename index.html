<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bahar'a küçük bir oyun 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff7aa8;
    --deep: #e0457b;
    --cream: #fff8f3;
    --ink: #5b2a3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    background: #ffe6ee;
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(160deg, #ffd9e8 0%, #fff1e6 45%, #e8dcff 100%);
    transform: translateZ(0);
  }
  .script { font-family: 'Dancing Script', cursive; }

  #petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal { position: absolute; top: -40px; animation: fall linear forwards; will-change: transform; user-select: none; }
  @keyframes fall { to { transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin)); } }

  .stage {
    position: relative; z-index: 1; width: 100%; max-width: 440px;
    background: rgba(255, 255, 255, .88); border-radius: 30px;
    padding: 36px 26px 30px; text-align: center;
    box-shadow: 0 20px 50px rgba(224, 69, 123, .2);
  }
  .screen { display: none; animation: pop .45s cubic-bezier(.2, 1.3, .4, 1); }
  .screen.active { display: block; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }

  h1 { font-size: clamp(2.6rem, 11vw, 3.4rem); color: var(--deep); line-height: 1.1; }
  .wave { display: inline-block; font-size: 2.6rem; animation: wave 1.8s ease-in-out infinite; transform-origin: 70% 80%; }
  @keyframes wave { 20% { transform: rotate(18deg); } 40% { transform: rotate(-8deg); } 60% { transform: rotate(14deg); } 80%, 100% { transform: none; } }
  .lead { font-size: 1.08rem; font-weight: 500; line-height: 1.6; margin: 16px 0 26px; }

  .btn {
    font-family: inherit; font-size: 1.08rem; font-weight: 700; color: #fff;
    padding: 14px 34px; border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--deep));
    box-shadow: 0 10px 24px rgba(224, 69, 123, .35);
    transition: transform .2s ease;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: #fff; color: var(--deep); box-shadow: 0 6px 16px rgba(224, 69, 123, .15); }

  /* Soru ekranı */
  .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 22px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: #ffd0df; transition: background .3s, transform .3s; }
  .dots span.on { background: var(--deep); transform: scale(1.25); }
  .q-title { font-size: 2.2rem; color: var(--deep); margin-bottom: 22px; min-height: 1.3em; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .option {
    font-family: inherit; color: var(--ink); cursor: pointer;
    background: #fff; border: 2px solid #ffdbe7; border-radius: 22px;
    padding: 22px 10px 18px; font-size: 1.05rem; font-weight: 700;
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .option .emoji { display: block; font-size: 2.8rem; margin-bottom: 8px; }
  .option:hover { transform: translateY(-4px); border-color: var(--pink); }
  .option.picked { background: #ffe9f1; border-color: var(--deep); transform: scale(1.04); }
  .option.faded { opacity: .4; }
  .reaction { min-height: 1.6em; margin-top: 20px; font-weight: 600; color: var(--deep); opacity: 0; transition: opacity .3s; }
  .reaction.show { opacity: 1; }

  /* Sonuç */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin: 20px 0 22px; }
  .chip { background: #fff; border-radius: 999px; padding: 8px 15px; font-weight: 600; font-size: .98rem; box-shadow: 0 4px 12px rgba(224, 69, 123, .12); }
  .note { font-weight: 500; line-height: 1.6; margin-bottom: 22px; }
  .actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .sign { font-size: 1.7rem; color: var(--deep); margin-top: 22px; }
  #copied { min-height: 1.4em; font-size: .92rem; font-weight: 600; color: var(--deep); margin-top: 8px; }

  #music-btn {
    position: fixed; right: 18px; bottom: 18px; z-index: 5;
    width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer;
    background: #fff; font-size: 1.3rem; box-shadow: 0 8px 22px rgba(224, 69, 123, .3);
  }
  #music-btn.playing { animation: spin 5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="petals"></div>

<main class="stage">
  <div class="screen active" id="intro">
    <span class="wave">👋</span>
    <h1 class="script">Selam Bahar!</h1>
    <p class="lead">Seni biraz daha tanımak istedim, o yüzden sana küçük bir oyun yaptım. 8 soru, 1 dakika. Hazır mısın?</p>
    <button class="btn" id="start">Başla 🌸</button>
  </div>

  <div class="screen" id="quiz">
    <div class="dots" id="dots"></div>
    <h2 class="q-title script" id="q-title"></h2>
    <div class="options">
      <button class="option" id="opt-a"></button>
      <button class="option" id="opt-b"></button>
    </div>
    <p class="reaction" id="reaction"></p>
  </div>

  <div class="screen" id="result">
    <h1 class="script">İşte Bahar 🌸</h1>
    <div class="chips" id="chips"></div>
    <p class="note" id="note"></p>
    <div class="actions">
      <button class="btn" id="send">Cevaplarımı İbo'ya gönder 💌</button>
      <button class="btn ghost" id="again">Baştan oyna</button>
    </div>
    <p id="copied"></p>
    <p class="sign script">— İbo</p>
  </div>
</main>

<button id="music-btn" aria-label="Müziği aç/kapat">🔇</button>
<audio id="audio" src="music.mp3" loop preload="none"></audio>

<script>
  // Sorular: [soru, [emoji, seçenek, İbo'nun tepkisi], [emoji, seçenek, tepki]]
  const QUESTIONS = [
    ['Çay mı, kahve mi?',        ['🍵', 'Çay', 'Demli olsun o zaman.'],            ['☕', 'Kahve', 'Not alındı. ☕']],
    ['Deniz mi, dağ mı?',        ['🌊', 'Deniz', 'Gün batımı da dahil mi?'],        ['⛰️', 'Dağ', 'Temiz hava, güzel seçim.']],
    ['Sabah mı, gece mi?',       ['🌅', 'Sabah insanı', 'Saygı duyuyorum, yapamıyorum.'], ['🌙', 'Gece kuşu', 'Gece mesajları serbest yani.']],
    ['Film mi, dizi mi?',        ['🎬', 'Film', 'Öneri listeni bekliyorum.'],       ['📺', 'Dizi', 'Bir bölüm daha, değil mi?']],
    ['Tatlı mı, tuzlu mu?',      ['🍰', 'Tatlı', 'Tahmin etmiştim.'],               ['🍟', 'Tuzlu', 'Patatesler paylaşılır mı peki?']],
    ['Kedi mi, köpek mi?',       ['🐱', 'Kedi', 'Miyav.'],                          ['🐶', 'Köpek', 'Hav hav.']],
    ['Plan mı, spontane mi?',    ['🗓️', 'Planlı', 'Tamam, haber vererek gelirim.'], ['🎲', 'Spontane', 'Sürprizlere açıksın yani.']],
    ['İlkbahar mı, sonbahar mı?', ['🌸', 'İlkbahar', 'İkisinde de Bahar var zaten.'], ['🍂', 'Sonbahar', 'İkisinde de Bahar var zaten.']],
  ];

  const $ = id => document.getElementById(id);
  const screens = ['intro', 'quiz', 'result'];
  const show = id => screens.forEach(s => $(s).classList.toggle('active', s === id));
  let index = 0, answers = [], locked = false;

  $('dots').innerHTML = QUESTIONS.map(() => '<span></span>').join('');

  function renderQuestion() {
    const [title, a, b] = QUESTIONS[index];
    $('q-title').textContent = title;
    [['opt-a', a], ['opt-b', b]].forEach(([id, opt]) => {
      const el = $(id);
      el.className = 'option';
      el.innerHTML = `<span class="emoji">${opt[0]}</span>${opt[1]}`;
    });
    $('reaction').classList.remove('show');
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i <= index));
    locked = false;
    // Animasyonu her soruda yeniden oynat
    $('quiz').style.animation = 'none'; void $('quiz').offsetWidth; $('quiz').style.animation = '';
  }

  function pick(which) {
    if (locked) return;
    locked = true;
    const opt = QUESTIONS[index][which === 'a' ? 1 : 2];
    answers[index] = opt;
    $('opt-' + which).classList.add('picked');
    $('opt-' + (which === 'a' ? 'b' : 'a')).classList.add('faded');
    $('reaction').textContent = opt[2];
    $('reaction').classList.add('show');
    for (let i = 0; i < 6; i++) setTimeout(() => spawn([opt[0]]), i * 90);
    setTimeout(() => {
      index++;
      index < QUESTIONS.length ? renderQuestion() : renderResult();
    }, 1300);
  }
  $('opt-a').addEventListener('click', () => pick('a'));
  $('opt-b').addEventListener('click', () => pick('b'));

  function renderResult() {
    $('chips').innerHTML = answers.map(a => `<span class="chip">${a[0]} ${a[1]}</span>`).join('');
    const drink = answers[0][1].toLowerCase();
    $('note').textContent = `Güzel seçimler. Geri kalanını bir ${drink} içerken konuşuruz belki. 😊`;
    $('copied').textContent = '';
    show('result');
    for (let i = 0; i < 30; i++) setTimeout(() => spawn(['🌸', '🌷', '✨']), i * 60);
  }

  $('start').addEventListener('click', () => {
    index = 0; answers = [];
    show('quiz'); renderQuestion();
  });
  $('again').addEventListener('click', () => $('start').click());

  // Cevapları paylaş / kopyala
  $('send').addEventListener('click', async () => {
    const text = 'Cevaplarım 🌸\n' + answers.map(a => `${a[0]} ${a[1]}`).join('\n');
    try {
      if (navigator.share) { await navigator.share({ text }); return; }
      await navigator.clipboard.writeText(text);
      $('copied').textContent = 'Kopyalandı! İbo\'ya yapıştırıp gönderebilirsin. 💌';
    } catch (e) {
      if (e.name !== 'AbortError') $('copied').textContent = 'Kopyalanamadı, ekran görüntüsü de olur. 😄';
    }
  });

  // Müzik (isteğe bağlı, düğmeyle açılır)
  const audio = $('audio'), musicBtn = $('music-btn');
  musicBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().then(() => { musicBtn.classList.add('playing'); musicBtn.textContent = '🎵'; }).catch(() => {});
    } else {
      audio.pause(); musicBtn.classList.remove('playing'); musicBtn.textContent = '🔇';
    }
  });

  // Dökülen çiçekler
  const petals = $('petals');
  function spawn(symbols) {
    if (document.hidden) return;
    const p = document.createElement('span');
    p.className = 'petal';
    p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = 14 + Math.random() * 16 + 'px';
    p.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    p.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
    const dur = 6 + Math.random() * 5;
    p.style.animationDuration = dur + 's';
    petals.appendChild(p);
    setTimeout(() => p.remove(), dur * 1000);
  }
  setInterval(() => spawn(['🌸', '🌷', '🤍']), 1100);
</script>
</body>
</html>
